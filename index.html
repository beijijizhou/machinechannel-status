<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root { --bg:#f4f4f6; --fg:#1d1d1f; --muted:#6e6e73; --card:#fff; --line:#dcdce0; --red:#c0392b; --red-bg:#fdecea;
        --green:#1e8449; --green-bg:#e8f6ee; --amber:#b9770e; --amber-bg:#fdf3e1; --blue:#2471a3; --blue-bg:#eaf2fa; }
@media (prefers-color-scheme: dark) { :root { --bg:#161617; --fg:#f5f5f7; --muted:#a1a1a6; --card:#1f1f21; --line:#38383a;
        --red:#ff6b5e; --red-bg:#3a1f1c; --green:#58d68d; --green-bg:#17301f; --amber:#f5b041; --amber-bg:#3a2f14; --blue:#5dade2; --blue-bg:#152a3a; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
header { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); }

main { max-width:1500px; margin:0 auto; padding:18px 20px; display:grid; gap:16px; }
.muted { color:var(--muted); font-size:13px; }
.panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; overflow-x:auto; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
.tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; }
.tile b { display:block; font-size:26px; line-height:1.2; font-variant-numeric:tabular-nums; }
.tile span { color:var(--muted); font-size:13px; } .tile small { display:block; color:var(--muted); font-size:12px; }
.tile.green b { color:var(--green); } .tile.red b { color:var(--red); } .tile.amber b { color:var(--amber); } .tile.blue b { color:var(--blue); }
table { border-collapse:collapse; width:100%; font-size:14px; font-variant-numeric:tabular-nums; }
th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top; white-space:nowrap; }
th { color:var(--muted); font-weight:500; font-size:13px; } tr:last-child td { border-bottom:0; }
td.wrap { white-space:normal; overflow-wrap:anywhere; max-width:420px; font:12px ui-monospace,Consolas,monospace; color:var(--muted); }
.pill { display:inline-block; padding:1px 8px; border-radius:9px; font-size:12px; }
.pill.ok { background:var(--green-bg); color:var(--green); } .pill.bad { background:var(--red-bg); color:var(--red); }
.pill.warn { background:var(--amber-bg); color:var(--amber); } .pill.info { background:var(--blue-bg); color:var(--blue); }
.dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--muted); margin-right:7px; }
.dot.on { background:var(--green); } .dot.off { background:var(--red); }
button, input, select { font:inherit; font-size:13px; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:4px 10px; }
button { cursor:pointer; } button.go { background:var(--blue); color:#fff; border-color:var(--blue); } button:disabled { opacity:.5; cursor:default; }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.alert { border-color:var(--red); background:var(--red-bg); }
.token { font:13px ui-monospace,Consolas,monospace; overflow-wrap:anywhere; padding:8px 10px; background:var(--bg); border-radius:8px; user-select:all; }
.toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:8px 16px; border-radius:8px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
.toast.show { opacity:.93; }
.field { display:flex; flex-direction:column; gap:3px; } .field > span { color:var(--muted); font-size:12px; }
.issue { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
.issue .row { align-items:flex-end; }
.newkey { margin-top:12px; border:2px solid var(--red); background:var(--red-bg); border-radius:10px; padding:12px 14px; }
.empty { padding:70px 20px; text-align:center; color:var(--muted); font-size:17px; }
</style></head>
<body>
<header><h1>MachineChannel</h1><span class="muted">机器指令通道：只负责把指令送到机器、把回答带回来，不读指令内容</span>
  <span style="flex:1"></span><span class="muted" id="read"></span><button id="forget">换一把钥匙</button></header>
<main id="main"><div class="empty">加载中…</div></main>
<div id="toast" class="toast"></div>
<script>
const CHANNEL = { url: "https://ziveajlinhmafqcweahx.supabase.co", key: "sb_publishable_WoafNUwm9EwmDfrrinrvbQ_iQlIQwsF" };
const LITE = { revision: "ca2a508541b7", sha256: "e61fef3cc5a89cf01dd01924fc9d71fbd7cee43b0b2bb9943c5a257006caeb58" };   // the published lite.ps1 (scripts/publish_page.py)
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = v => Number(v || 0).toLocaleString("en-US");
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 3200); }
function token() {
  let t = ""; try { t = localStorage.getItem("mc_token") || ""; } catch (e) {}
  if (!t) { t = (prompt("请输入通道的管理钥匙（mc_ 开头）") || "").trim(); try { if (t) localStorage.setItem("mc_token", t); } catch (e) {} }
  return t;
}
async function rpc(name, args = {}) {
  const r = await fetch(`${CHANNEL.url}/rest/v1/rpc/${name}`, { method: "POST",
    headers: { "Content-Type": "application/json", apikey: CHANNEL.key }, body: JSON.stringify({ p_token: token(), ...args }) });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (/unknown or revoked key|may not do this/.test(body.message || "")) { try { localStorage.removeItem("mc_token"); } catch (e) {} }
    throw new Error({ "MachineChannel: unknown or revoked key": "钥匙不对，或者已经作废" }[body.message] || body.message || `请求失败（${r.status}）`);
  }
  return body;
}
const when = s => s ? new Date(s).toLocaleString("zh-CN", { hour12: false, month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
const ago = s => { if (!s) return "从未"; const sec = Math.round((Date.now() - new Date(s)) / 1000);
  return sec < 90 ? sec + " 秒前" : sec < 5400 ? Math.round(sec / 60) + " 分钟前" : sec < 172800 ? Math.round(sec / 3600) + " 小时前" : Math.round(sec / 86400) + " 天前"; };
const STATUS = { queued: ["等机器来取", "warn"], delivered: ["机器正在执行", "info"], done: ["完成", "ok"], error: ["没有成功", "bad"], expired: ["机器没来取，已作废", "bad"] };
const KIND = { machine: "机器", app: "项目", admin: "管理" };
const TYPE = { dtf: "DTF 生产机", uv: "UV 生产机", "3d": "3D 生产机", shop: "店铺机", none: "非生产机" };
let shown = null;   // a key that was just issued: shown until dismissed, it cannot be read again
// The programs on a machine that can be asked how they are and be started or stopped through the
// channel: what to send, and how to read "is it running" out of the program's own answer. The
// channel still does not read messages; this is the owner's page knowing the programs the owner runs.
// all: the buttons over the table that reach every machine at once.
const SOFT = {
  comfy: { name: "ComfyUI 生图", on: "开着", off: "关着", status: { do: "status" }, start: { do: "start" }, stop: { do: "stop" }, all: ["stop"],
    running: r => !!r.running, warn: "它开着时占约 7 GB 显存；这台机器正在打印的话先别开。" },
  logoguard: { name: "LogoGuard 检测", on: "检测中", off: "已停", status: { do: "status" }, start: { do: "start" }, stop: { do: "stop" }, all: [],
    running: r => r.worker === "running", warn: "停了以后这台机器不再参与图片检测，直到再开。" },
  automaticprint: { name: "AutomaticPrint 监控", on: "在运行", off: "没在运行", status: { do: "status" }, start: { do: "start_monitor" }, all: ["start"],
    running: r => !!(r.monitor && r.monitor.running) || r.started === true || r.already_running === true },

let soft = {}, softAt = null, softBusy = "";   // soft[machine][app] = {running, error}: as last answered, read when asked - not with every ten seconds
const answerOf = x => { try { const r = JSON.parse(x.reply); return x.status === "done" && r && r.ok !== false ? { running: SOFT[x.app].running(r) } : { error: (r && r.error) || x.reply || STATUS[x.status][0] }; }
  catch (e) { return { error: x.reply || STATUS[x.status][0] }; } };
// Sends, then looks for the answers a few times (a machine asks the channel within a minute) and stops looking.
async function ask(what, sends, seconds) {
  softBusy = what; refresh();
  try {
    const ids = (await Promise.all(sends.map(a => rpc("mc_send", { ...a, p_ttl_seconds: 180, p_sender: "状态页" })))).flat().map(x => x.id);
    for (let waited = 0, open = ids; open.length && waited < seconds; waited += 6) {
      await new Promise(r => setTimeout(r, 6000));
      const rows = await rpc("mc_result", { p_ids: open });
      for (const x of rows) if (SOFT[x.app] && ["done", "error", "expired"].includes(x.status)) (soft[x.machine] = soft[x.machine] || {})[x.app] = answerOf(x);
      open = rows.filter(x => ["queued", "delivered"].includes(x.status)).map(x => x.id);
    }
    softAt = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  } catch (e) { toast(e.message); }
  softBusy = ""; refresh();
}
const softPill = (m, a) => { const k = SOFT[a], st = (soft[m.machine] || {})[a], v = ((m.info || {}).versions || {})[a];
  if (!k) return `<span class="pill info">${esc(a)}${v ? " " + esc(v) : ""}</span>`;
  const btn = (act, text) => k[act] && m.online ? ` <button data-soft="${act}" data-app="${a}" data-machine="${esc(m.machine)}" data-label="${esc(m.label || m.machine)}">${text}</button>` : "";
  return `<span style="white-space:nowrap"><span class="pill ${!st ? "info" : st.error ? "bad" : st.running ? "ok" : "warn"}" title="${esc(st && st.error || "")}">${esc(k.name)}${!st ? "" : st.error ? " 没答上来" : " " + (st.running ? k.on : k.off)}</span>${
    !st || st.error ? "" : st.running ? btn("stop", "关") : btn("start", "开")}</span>`; };

// Standing orders (an app's release) and how each app's next one starts out: read when the page
// opens, after each step taken here and when asked - not with every ten seconds' reading.
let orders = null, ordersAt = null;
const versionOf = body => body ? esc(body.version || JSON.stringify(body).slice(0, 60)) : "–";
function releases(d) {
  if (!orders) return `<div class="panel"><h2>发版</h2><span class="muted">读取中…</span></div>`;
  const set = Object.fromEntries(orders.rollout.map(r => [r.app, r]));
  const apps = [...new Set([...orders.orders.map(o => o.app), ...orders.rollout.map(r => r.app),
    ...d.machines.flatMap(m => (m.info || {}).apps || [])])].filter(a => !["channel", "remote"].includes(a)).sort();
  const row = o => { const ms = o.machines, has = ms.filter(m => m.handed).length, there = ms.filter(m => m.version && m.version === (o.body || {}).version).length,
      waiting = ms.filter(m => m.in_share && !m.handed), held = ms.filter(m => !m.in_share && !m.handed);
    const wider = [25, 50, 100].filter(n => n > o.share && held.length);
    return `<tr><td><b>${esc(o.app)}</b></td><td><b>${versionOf(o.body)}</b><div class="muted">${esc(o.sender || "")} · ${when(o.created_at)}</div></td>
      <td>${o.share >= 100 ? "全部机器" : `${o.share}%`}${o.first.length ? `<div class="muted">先发：${o.first.map(esc).join("、")}</div>` : ""}</td>
      <td>${has} / ${ms.length} 台已领${there !== has ? `，${there} 台已是这一版` : ""}
        ${waiting.length ? `<div class="muted">等它们上线：${waiting.map(m => esc(m.label || m.machine)).join("、")}</div>` : ""}
        ${held.length ? `<div class="muted">还没放到：${held.length} 台</div>` : ""}</td>
      <td>${o.previous ? versionOf(o.previous) : `<span class="muted">没有</span>`}</td>
      <td>${wider.map(n => `<button class="go" data-widen="${esc(o.app)}" data-share="${n}">放到 ${n === 100 ? "全部" : n + "%"}</button>`).join(" ")}
        ${o.share > 0 && held.length ? `<button data-widen="${esc(o.app)}" data-share="0">先不往下发</button>` : ""}
        ${o.previous ? `<button data-back="${esc(o.app)}" data-to="${versionOf(o.previous)}" data-from="${versionOf(o.body)}">退回上一版</button>` : ""}</td></tr>`; };
  return `<div class="panel"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">发版</h2>
      <span class="muted">各项目公布的“每台机器应有的版本” · 先发给谁、放到多少、退回都在这里定 · 读取于 ${ordersAt || ""}</span>
      <span style="flex:1"></span><button id="ordersNow">重新读取</button></div>
    <table><tr><th>程序</th><th>现在公布的</th><th>放到了</th><th>机器</th><th>上一版</th><th></th></tr>
      ${orders.orders.map(row).join("") || `<tr><td class="muted" colspan="6">现在没有公布任何版本</td></tr>`}</table>
    <div class="muted" style="margin:12px 0 6px">下一次发版从哪里开始（每个程序各设一次，之后每次发版都照这个开始）</div>
    <table><tr><th>程序</th><th>先发给</th><th>再加上其余机器的</th><th></th></tr>${apps.map(a => { const r = set[a] || { share: 100, first: [] };
      return `<tr><td><b>${esc(a)}</b></td><td>${r.first.length ? r.first.map(esc).join("、") : `<span class="muted">不指定</span>`}</td>
        <td>${r.share >= 100 ? "全部（一次发给所有机器）" : r.share + "%"}</td>
        <td><button data-rollout="${esc(a)}" data-share="${r.share}" data-first="${esc(r.first.join(","))}">改</button></td></tr>`; }).join("")}</table></div>`;
}
async function readOrders() {
  try { orders = await rpc("mc_orders"); ordersAt = new Date().toLocaleTimeString("zh-CN", { hour12: false }); }
  catch (e) { if (!orders) orders = { orders: [], rollout: [] }; toast("发版读取失败：" + e.message); }
}
// The machines an order has just been let out to are told to look now (the channel's function mc-push).
const pushNow = app => fetch(`${CHANNEL.url}/functions/v1/mc-push`, { method: "POST", headers: { "Content-Type": "application/json", apikey: CHANNEL.key },
  body: JSON.stringify({ p_token: token(), p_app: app }) }).then(r => r.json()).catch(() => ({}));
// A shop computer runs the light end (lite.ps1), which has versions of its own: it is compared
// with the published script, not with the agent's releases.
const isLite = m => String((m.info || {}).agent || "").startsWith("lite-");
const newest = (m, latest) => isLite(m) ? "lite-" + LITE.revision : latest;
const current = (m, latest) => !!newest(m, latest) && (m.info || {}).agent === newest(m, latest);
const agentName = m => { const a = String((m.info || {}).agent || ""); return a.startsWith("lite-") ? a.slice(0, 12) : a.slice(0, 7); };
const site = () => location.origin + location.pathname.replace(/[^/]*$/, "");

function html(d) {
  const ms = d.machines, on = ms.filter(m => m.online), latest = (d.releases[0] || {}).revision || "";

  const open = d.messages.filter(x => x.status === "queued" || x.status === "delivered").length;
  const failed = day.filter(x => x.status === "error" || x.status === "expired").length;
  const old = ms.filter(m => !m.key), behind = ms.filter(m => (m.info || {}).agent && newest(m, latest) && !current(m, latest));
  const programs = [...new Set(ms.flatMap(m => (m.info || {}).apps || []))].filter(a => a !== "channel").sort();
  const live = d.keys.filter(k => !k.revoked_at);

  const mRow = m => { const i = m.info || {}, cur = current(m, latest);
    return `<tr><td><span class="dot ${m.online ? "on" : "off"}"></span><b>${esc(m.label || "—")}</b> <button data-name="${esc(m.machine)}" data-label="${esc(m.label || "")}" title="改这台机器的名字">改名</button>

      <td>${esc(m.machine)}</td><td>${m.online ? `<span class="pill ok">在线</span>` : `<span class="pill bad">离线</span> <span class="muted">${ago(m.seen_at)}</span>`}</td>
      <td>${esc(agentName(m))} ${!i.agent ? "" : cur ? `<span class="pill ok">最新</span>` : newest(m, latest) ? `<span class="pill warn">旧版本</span>` : ""}</td>
      <td>${(i.apps || []).map(a => softPill(m, a)).join(" ") || `<span class="muted">没有登记程序</span>`}${(i.running || []).length ? ` <span class="muted">正在执行 ${esc(i.running.join("、"))}</span>` : ""}</td>

      <td>${num(m.today)}${m.waiting ? ` <span class="pill warn">${m.waiting} 条在等</span>` : ""}</td>
      <td><button data-ping="${esc(m.machine)}" ${m.online ? "" : "disabled"}>问一声</button> <button data-update="${esc(m.machine)}" ${m.online && i.agent && newest(m, latest) && !cur ? "" : "disabled"}>更新通道程序</button></td></tr>`; };

    <td>${ms.filter(m => a.app === "channel" || ((m.info || {}).apps || []).includes(a.app)).length} 台</td><td>${ago(a.last_at)}</td></tr>`;
  const keyRow = k => `<tr><td><span class="pill ${k.kind === "admin" ? "bad" : k.kind === "app" ? "info" : "ok"}">${KIND[k.kind]}</span></td><td><b>${esc(k.name)}</b>${k.pending ? ` <span class="pill warn">待批准 ${esc(k.code)}</span>` : ""}</td><td class="muted">${esc(k.note || "")}</td>
    <td>${when(k.created_at)}</td><td>${ago(k.last_used_at)}</td><td>${k.revoked_at ? `<span class="muted">已作废 ${when(k.revoked_at)}</span>` : `<button data-revoke="${k.id}" data-what="${esc(KIND[k.kind] + " " + k.name)}">作废</button>`}</td></tr>`;

  const alerts = [
    ...asking.map(k => `<b>${esc(k.name)}</b> 申请加入通道（核对码 <b>${esc(k.code)}</b>，和那台电脑安装窗口里显示的一致才批准） · ${when(k.created_at)}
      <button class="go" data-approve="${k.id}">批准</button> <button data-revoke="${k.id}" data-what="${esc(k.name + " 的加入申请")}">拒绝</button>`),

    failed ? `最近 24 小时有 <b>${failed}</b> 条指令没有成功或没被取走，见下面的指令记录。` : ""].filter(Boolean);
  return `${alerts.length ? `<div class="panel alert"><h2>需要你看一下</h2>${alerts.map(a => `<div>${a}</div>`).join("")}</div>` : ""}
    <div class="tiles">
      ${tile("green", `${on.length}<span style="font-size:15px"> / ${ms.length} 台</span>`, "机器在线", `离线 ${ms.length - on.length} 台`)}
      ${tile("", num(day.length), "最近 24 小时的指令", `${num(day.filter(x => x.status === "done").length)} 条完成`)}
      ${tile(open ? "amber" : "", num(open), "正在路上的指令", "已发出，还没有回答")}
      ${tile(failed ? "red" : "", num(failed), "没有成功的", "出错，或机器没来取")}
      ${tile("blue", num(live.length), "有效的钥匙", `机器 ${live.filter(k => k.kind === "machine").length} · 项目 ${live.filter(k => k.kind === "app").length} · 管理 ${live.filter(k => k.kind === "admin").length}`)}
      ${tile(behind.length ? "amber" : "", latest ? latest.slice(0, 7) : "–", "通道程序最新版本", (latest ? (behind.length ? `${behind.length} 台还没更新` : "所有机器都是最新") : "还没有发布过") + ` · 店铺机用的是 lite-${esc(LITE.revision.slice(0, 7))}`)}
    </div>
    <div class="panel"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">机器</h2><span class="muted">没事的机器每分钟报到一次，有指令时每 10 秒 · 名字是人叫的名字，发指令时名字和电脑名都认</span>
        <span style="flex:1"></span><button class="go" id="updateAll" ${behind.filter(m => m.online).length ? "" : "disabled"}>在线的旧版本机器全部更新通道程序</button></div>
      <div class="row" style="margin-bottom:8px"><b>软件状态</b>
        <button class="go" id="softRead" ${softBusy ? "disabled" : ""}>读取每台机器上软件的状态</button>
        ${Object.entries(SOFT).flatMap(([a, k]) => k.all.map(act => `<button data-softall="${act}" data-app="${a}" ${softBusy ? "disabled" : ""}>${act === "stop" ? "全部关闭" : "全部启动"} ${esc(k.name)}</button>`)).join(" ")}
        <span class="muted">${softBusy ? esc(softBusy) + "，等机器回答（最多一分多钟）…" : softAt ? `读取于 ${softAt} · 要最新的再点一次读取` : "还没读过：点“读取”后，每台机器的程序旁边会显示开着还是关着，并有开和关的按钮"}</span></div>
      <table><tr><th>名字</th><th>电脑名</th><th>状态</th><th>通道程序</th><th>登记的程序</th><th>钥匙</th><th>CPU</th><th>显卡</th><th>24 小时指令</th><th></th></tr>${ms.map(mRow).join("")}</table></div>
    ${releases(d)}
    <div class="panel"><h2>每一条指令 <span class="muted" style="font-weight:400">最近 ${d.messages.length} 条，最新的在前 · 内容和回答是各项目自己的，通道只是原样送达</span></h2>
      ${d.messages.length ? `<table><tr><th>时间</th><th>机器</th><th>程序</th><th>内容</th><th>结果</th><th>用时</th><th>机器的回答</th><th>谁发的</th></tr>${d.messages.map(msgRow).join("")}</table>` : `<span class="muted">还没有指令</span>`}</div>
    <div class="panel"><h2>各项目用了多少 <span class="muted" style="font-weight:400">最近 7 天 · “channel”是通道自己的问一声和更新</span></h2>
      <table><tr><th>程序</th><th>指令</th><th>完成</th><th>出错</th><th>没被取走</th><th>在路上</th><th>装了它的机器</th><th>最近一次</th></tr>${d.apps.map(appRow).join("") || `<tr><td class="muted">暂无</td></tr>`}</table></div>
    <div class="panel"><h2>钥匙 <span class="muted" style="font-weight:400">机器钥匙：只能替那一台机器报到和取指令 · 项目钥匙：只能给自己的程序发指令 · 管理钥匙：全部</span></h2>
      <div class="issue"><div class="row">
          <label class="field"><span>发哪一种</span><select id="newKind"><option value="app">项目钥匙（给一个程序的发送方）</option><option value="machine">机器钥匙（给一台电脑）</option><option value="admin">管理钥匙（给负责人）</option></select></label>
          <label class="field" data-for="app"><span>程序名（不是机器名）</span><select id="newApp">${programs.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join("")}<option value="">别的程序（还没有机器登记）…</option></select></label>
          <label class="field" data-for="app" id="newAppOtherBox"><span>新程序名：小写英文，和机器上登记的一致</span><input id="newAppOther" placeholder="例如 halooai" size="22"></label>
          <label class="field" data-for="machine"><span>电脑名（那台电脑上 echo %COMPUTERNAME%）</span><input id="newName" placeholder="例如 HALOOPRINTER1" size="24"></label>
          <label class="field" data-for="machine"><span>人叫它的名字</span><input id="newLabel" placeholder="例如 3D1" size="12"></label>
          <label class="field" data-for="machine"><span>类型</span><select id="newType"><option value="">不分类型</option>${Object.entries(TYPE).map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select></label>
          <label class="field" data-for="admin"><span>给谁用</span><input id="newAdmin" placeholder="例如 负责人的手机" size="20"></label>
          <label class="field"><span>备注（可不填）</span><input id="newNote" placeholder="放在哪、给谁用" size="20"></label>
          <button class="go" id="issue">发一把新钥匙</button></div>
        ${shown ? `<div class="newkey" id="newKey"><b>新钥匙：${esc(shown.what)}</b>（只显示这一次，请现在复制保存）<div class="token" style="margin-top:8px">${esc(shown.token)}</div>
          ${shown.kind === "machine" && shown.type === "shop" ? `<div class="muted" style="margin-top:8px">在那台电脑上装通道（店铺机，不要管理员、不要 Python）：打开 PowerShell，运行这一行。</div>
          <div class="token">powershell -NoProfile -ExecutionPolicy Bypass -Command "$f = Join-Path $env:TEMP 'mc-lite.ps1'; Invoke-WebRequest '${esc(site())}lite.ps1' -UseBasicParsing -OutFile $f; &amp; $f -Token '${esc(shown.token)}'"</div>`
          : shown.kind === "machine" ? `<div class="muted" style="margin-top:8px">在那台电脑上装通道（需要 Python 3.10 以上）：右键“以管理员身份运行”打开 PowerShell，运行这一行。带 -Remote 的意思是这台机器接受你的远程指令（程序名 remote）；在机器上运行 C:\MachineChannel\scripts\remote.ps1 off 就关掉，去掉 -Remote 则一开始就不开。</div>
          <div class="token">powershell -ExecutionPolicy Bypass -Command "iwr ${esc(site())}bootstrap.ps1 -UseBasicParsing -OutFile $env:TEMP\\mc-bootstrap.ps1; &amp; $env:TEMP\\mc-bootstrap.ps1 -Token ${esc(shown.token)} -Remote"</div>` : ""}
          <div class="row" style="margin-top:8px"><button class="go" id="copyKey">复制钥匙</button><button id="hideKey">我已保存，关掉</button><span class="muted">通道里只存了它的校验值，关掉之后谁也看不到原文，丢了只能作废重发。</span></div></div>` : ""}
        <div class="muted" style="margin-top:8px" data-for="app">项目钥匙发给“往机器上的某个程序发指令的那一方”（例如 halooai 的发版脚本）。程序名就是上面“机器”表里“登记的程序”一列的名字；填成机器名（如 LM）的钥匙什么也发不了。</div>
        <div class="muted" style="margin-top:8px" data-for="machine">店铺机不用在这里发钥匙：在那台电脑上打开 PowerShell 运行下面这一行（把 SHOP1 换成给它起的名字，英文字母和数字），它会自己申请加入并显示一个核对码，然后在本页最上面点“批准”。这一行里没有任何钥匙，每台店铺机都用同一行。
          <div class="token" style="margin-top:6px">powershell -NoProfile -ExecutionPolicy Bypass -Command "$f = Join-Path $env:TEMP 'mc-lite.ps1'; Invoke-WebRequest '${esc(site())}lite.ps1' -UseBasicParsing -OutFile $f; &amp; $f -Name SHOP1"</div></div>
        <div id="issueNote" class="muted" style="margin-top:6px"></div>
</div>
      <table><tr><th>种类</th><th>给谁</th><th>备注</th><th>发出时间</th><th>最近使用</th><th></th></tr>${d.keys.map(keyRow).join("")}</table></div>
    <div class="panel"><h2>通道程序的版本</h2>
      <table><tr><th>版本</th><th>校验值</th><th>大小</th><th>发布时间</th><th>在用的机器</th></tr>${d.releases.map(r => `<tr><td><b>${esc(r.revision.slice(0, 7))}</b></td><td class="wrap">${esc(r.sha256)}</td>
        <td>${(r.bytes / 1024).toFixed(0)} KB</td><td>${when(r.published_at)}</td><td>${ms.filter(m => (m.info || {}).agent === r.revision).length} 台</td></tr>`).join("") || `<tr><td class="muted">还没有发布过</td></tr>`}</table></div>`;
}

let timer = null, data = null;
async function refresh() {
  clearTimeout(timer);
  if (document.hidden) return;
  try {
    data = await rpc("mc_status", { p_messages: 100 });
    if (!orders) await readOrders();
    const typed = {}, at = document.activeElement, focus = at && at.id && $("#main").contains(at) ? [at.id, at.selectionStart] : null;
    document.querySelectorAll("#main input[id], #main select[id]").forEach(e => typed[e.id] = e.value);
    $("#main").innerHTML = html(data);
    for (const [id, v] of Object.entries(typed)) { const e = document.getElementById(id);
      if (e && (e.tagName !== "SELECT" || [...e.options].some(o => o.value === v))) e.value = v; }
    if (focus) { const e = document.getElementById(focus[0]); if (e) { e.focus(); try { e.setSelectionRange(focus[1], focus[1]); } catch (x) {} } }
    $("#read").textContent = "读取于 " + new Date().toLocaleTimeString("zh-CN", { hour12: false }) + " · 每 10 秒自动更新";
    wire();
  } catch (e) {
    if (!data) $("#main").innerHTML = `<div class="empty">${esc(e.message)} <button onclick="refresh()">再试一次</button></div>`;
    else toast("读取失败：" + e.message);
  }
  timer = setTimeout(refresh, 10000);
}
const act = async (label, fn) => { try { await fn(); toast(label); } catch (e) { toast(e.message); } refresh(); };
function wire() {
  const latest = (data.releases[0] || {});
  const step = async (label, fn, app) => { try { await fn(); const p = app ? await pushNow(app) : null;
      toast(label + (p && p.due ? `，已通知 ${p.sent} / ${p.due} 台马上来取` : "")); } catch (e) { toast(e.message); }
    await readOrders(); refresh(); };
  const having = a => data.machines.filter(m => m.online && ((m.info || {}).apps || []).includes(a));
  const sr = $("#softRead"); if (sr) sr.onclick = () => ask("正在读取软件状态",
    Object.keys(SOFT).filter(a => having(a).length).map(a => ({ p_machine: "*", p_app: a, p_body: SOFT[a].status })), 90);
  document.querySelectorAll("button[data-softall]").forEach(b => b.onclick = () => { const a = b.dataset.app, act = b.dataset.softall, k = SOFT[a], n = having(a).length;
    if (!n) return toast(`现在没有在线的机器装着 ${k.name}`);
    if (confirm(`${act === "stop" ? "关闭" : "启动"}全部 ${n} 台在线机器上的 ${k.name}？`))
      ask(`正在${act === "stop" ? "关闭" : "启动"}全部 ${k.name}`, [{ p_machine: "*", p_app: a, p_body: k[act] }], 200); });
  document.querySelectorAll("button[data-soft]").forEach(b => b.onclick = () => { const a = b.dataset.app, act = b.dataset.soft, k = SOFT[a];
    if (confirm(`${act === "stop" ? "关闭" : "启动"} ${b.dataset.label} 上的 ${k.name}？${k.warn ? "\n" + k.warn : ""}`))
      ask(`正在${act === "stop" ? "关闭" : "启动"} ${b.dataset.label} 的 ${k.name}`, [{ p_machine: b.dataset.machine, p_app: a, p_body: k[act] }], 200); });
  const again = $("#ordersNow"); if (again) again.onclick = () => step("已重新读取", async () => {});
  document.querySelectorAll("button[data-widen]").forEach(b => b.onclick = () => { const n = Number(b.dataset.share), app = b.dataset.widen;
    if (confirm(n ? `把 ${app} 现在公布的版本放到${n === 100 ? "全部机器" : " " + n + "% 的机器"}？已经领过的不会重领。` : `${app} 现在公布的版本先不再往下发？已经领到的机器不受影响，指定先发的机器仍会领。`))
      step(n ? "已放量" : "已停在这里", () => rpc("mc_widen", { p_app: app, p_share: n }), n ? app : null); });
  document.querySelectorAll("button[data-back]").forEach(b => b.onclick = () => { const app = b.dataset.back;
    if (confirm(`把 ${app} 从 ${b.dataset.from} 退回 ${b.dataset.to}？所有机器都会领到 ${b.dataset.to}（已经是它的机器什么也不做）。`))
      step("已退回", () => rpc("mc_back", { p_app: app, p_sender: "状态页" }), app); });
  document.querySelectorAll("button[data-rollout]").forEach(b => b.onclick = () => { const app = b.dataset.rollout;
    const first = prompt(`${app} 每次发版先发给哪些机器？填机器的名字，用逗号分开，例如 SHOP1。留空 = 不指定。`, b.dataset.first);
    if (first === null) return;
    const share = prompt(`除了上面这些，再同时发给其余机器的百分之几？0 = 只发给上面这些，100 = 一次发给所有机器。`, b.dataset.share);
    if (share === null) return;
    const n = Number(share.trim());
    if (!Number.isInteger(n) || n < 0 || n > 100) return toast("百分比要填 0 到 100 的整数");
    step("已保存，下一次发版起生效", () => rpc("mc_rollout", { p_app: app, p_share: n, p_first: first.split(/[,，、\s]+/).map(x => x.trim()).filter(Boolean) })); });
  document.querySelectorAll("button[data-name]").forEach(b => b.onclick = () => {
    const v = prompt(`这台电脑（${b.dataset.name}）叫什么名字？例如 M3。留空 = 去掉名字。`, b.dataset.label);
    if (v !== null) act("名字已改", () => rpc("mc_name", { p_machine: b.dataset.name, p_label: v }));
  });
  document.querySelectorAll("button[data-kind]").forEach(b => b.onclick = () => {
    const v = prompt(`这台电脑（${b.dataset.kind}）是什么类型？填 dtf、uv、3d、shop（店铺机）或 none（非生产机）。留空 = 不分类型。`, b.dataset.now);
    if (v !== null) act("类型已改", () => rpc("mc_kind", { p_machine: b.dataset.kind, p_kind: v.trim().toLowerCase() }));
  });
  document.querySelectorAll("button[data-ping]").forEach(b => b.onclick = () =>
    act("已发出，回答会出现在指令记录里", () => rpc("mc_send", { p_machine: b.dataset.ping, p_app: "channel", p_body: { do: "ping" }, p_sender: "状态页" })));
  const stale = data.machines.filter(m => m.online && (m.info || {}).agent && newest(m, latest.revision) && !current(m, latest.revision));
  const update = name => { const m = data.machines.find(x => x.machine === name);   // each end is sent its own kind of version
    return rpc("mc_send", { p_machine: name, p_app: "channel", p_ttl_seconds: 3600, p_sender: "状态页",
      p_body: isLite(m) ? { do: "update", sha256: LITE.sha256 } : { do: "update", revision: latest.revision, sha256: latest.sha256 } }); };
  document.querySelectorAll("button[data-update]").forEach(b => b.onclick = () => act("更新指令已发出", () => update(b.dataset.update)));
  const all = $("#updateAll"); if (all) all.onclick = () => {
    if (confirm("让所有在线的机器把通道程序更新到最新版本？每台几秒钟，期间各项目的程序不受影响。")) act("更新指令已发给所有在线的旧版本机器", () => Promise.all(stale.map(m => update(m.machine)))); };
  document.querySelectorAll("button[data-approve]").forEach(b => b.onclick = () => act("已批准，这台机器下次报到就上线", () => rpc("mc_approve", { p_key_id: Number(b.dataset.approve) })));
  document.querySelectorAll("button[data-revoke]").forEach(b => b.onclick = () => {
    if (confirm(`作废“${b.dataset.what}”这把钥匙？用它的机器或项目马上就连不上通道，要重新发一把才行。`)) act("已作废", () => rpc("mc_revoke", { p_key_id: Number(b.dataset.revoke) })); });
  const names = new Set(data.machines.flatMap(m => [m.machine, m.label]).filter(Boolean).map(n => n.toLowerCase()));
  const liveApp = n => data.keys.filter(k => k.kind === "app" && !k.revoked_at && k.name === n).length;
  const form = () => {   // only the fields of the chosen kind show
    const kind = $("#newKind").value, app = $("#newApp").value || $("#newAppOther").value.trim();
    document.querySelectorAll(".issue [data-for]").forEach(e => e.style.display = e.dataset.for === kind ? "" : "none");
    if (kind === "app") $("#newAppOtherBox").style.display = $("#newApp").value ? "none" : "";
    $("#issueNote").innerHTML = kind !== "app" || !app ? "" : names.has(app.toLowerCase()) ? `<span class="pill bad">“${esc(app)}”是一台机器的名字，不是程序名</span>`
      : liveApp(app) ? `<span class="pill warn">${esc(app)} 已经有 ${liveApp(app)} 把有效的项目钥匙</span> 再发一把，旧的仍然有效；钥匙丢了才需要再发，发完把旧的作废。` : "";
  };
  ["#newKind", "#newApp", "#newAppOther"].forEach(q => { $(q).onchange = form; $(q).oninput = form; });
  form();
  $("#issue").onclick = async () => {
    const kind = $("#newKind").value, note = $("#newNote").value.trim(), label = $("#newLabel").value.trim(), type = $("#newType").value;
    const name = (kind === "app" ? $("#newApp").value || $("#newAppOther").value : kind === "machine" ? $("#newName").value : $("#newAdmin").value).trim();
    if (!name) { toast(kind === "app" ? "先选或填程序名" : kind === "machine" ? "先填电脑名" : "先写给谁用"); return; }
    if (kind === "app" && names.has(name.toLowerCase())) { toast(`“${name}”是一台机器的名字。项目钥匙要填程序名，例如 halooai`); return; }
    if (kind === "app" && liveApp(name) && !confirm(`${name} 已经有 ${liveApp(name)} 把有效的项目钥匙。再发一把？（旧的不会自动作废）`)) return;
    try {
      const token = kind === "machine"
        ? await rpc("mc_enroll", { p_machine: name, p_label: label || null, p_kind: type || null, p_note: note || null })
        : await rpc("mc_issue", { p_kind: kind, p_name: name, p_note: note || null });
      shown = { token, what: KIND[kind] + "钥匙 " + (label ? `${label}（${name}）` : name), kind, type };
    } catch (e) { toast(e.message); return; }
    await refresh();
    const k = $("#newKey"); if (k) k.scrollIntoView({ block: "center" });
  };
  const c = $("#copyKey"); if (c) c.onclick = () => navigator.clipboard.writeText(shown.token).then(() => toast("已复制"), () => toast("复制不了，请手动选中"));
  const h = $("#hideKey"); if (h) h.onclick = () => { shown = null; refresh(); };
}
$("#forget").onclick = () => { try { localStorage.removeItem("mc_token"); } catch (e) {} data = null; refresh(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
refresh();
</script></body></html>
